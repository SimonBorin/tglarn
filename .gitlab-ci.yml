variables:
  BASE_VERSION: "1.0.0"
  IMAGE_NAME: "tglarn"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  VENV_PATH: "${CI_PROJECT_DIR}/.venv"
  GIT_DEPTH: "0"
  KUBERNETES_CPU_REQUEST: "100m"
  KUBERNETES_CPU_LIMIT: "500m"
  KUBERNETES_MEMORY_REQUEST: "128Mi"
  KUBERNETES_MEMORY_LIMIT: "512Mi"
  KUBERNETES_HELPER_MEMORY_REQUEST: "64Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "128Mi"

stages:
  - before-run
  - test
  - build

default:
  tags:
    - rc-ai-learning
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - scheduler_failure
      - unknown_failure

Version Compute:
  stage: before-run
  tags:
    - rc-ai-learning
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git fetch --tags --force
    - |
      set -eu

      semver_pattern='^v?[0-9]+\.[0-9]+\.[0-9]+$'
      current_tag="$(git tag --points-at HEAD | grep -E "$semver_pattern" | head -n 1 || true)"

      if [ -n "${CI_COMMIT_TAG:-}" ] && echo "$CI_COMMIT_TAG" | grep -Eq "$semver_pattern"; then
        version="${CI_COMMIT_TAG#v}"
      elif [ -n "$current_tag" ]; then
        version="${current_tag#v}"
      else
        latest_tag="$(git tag --list --sort=-v:refname | grep -E "$semver_pattern" | head -n 1 || true)"
        if [ -n "$latest_tag" ]; then
          base="${latest_tag#v}"
          commit_count="$(git rev-list --count "${latest_tag}..HEAD")"
        else
          base="$BASE_VERSION"
          commit_count="$(git rev-list --count HEAD)"
        fi

        major="$(echo "$base" | cut -d. -f1)"
        minor="$(echo "$base" | cut -d. -f2)"
        patch="$(echo "$base" | cut -d. -f3)"
        version="${major}.${minor}.$((patch + commit_count))"
      fi

      {
        echo "NEW_TAG=$version"
        echo "IMAGE_TAG=$version"
        echo "IMAGE_URI=${IMAGE_NAME}:$version"
        echo "IMAGE_TAR=dist/${IMAGE_NAME}-${version}.tar"
        echo "IMAGE_TAR_GZ=dist/${IMAGE_NAME}-${version}.tar.gz"
      } > version.env

      cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

Python Tests:
  stage: test
  tags:
    - rc-ai-learning
  image:
    name: python:3.12-slim-bookworm
    entrypoint: [""]
  needs:
    - job: Version Compute
      artifacts: true
  cache:
    key:
      files:
        - pyproject.toml
      prefix: "python-${CI_PROJECT_PATH_SLUG}"
    paths:
      - .cache/pip/
      - .venv/
    policy: pull-push
  before_script:
    - python -m venv "$VENV_PATH"
    - . "$VENV_PATH/bin/activate"
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - . "$VENV_PATH/bin/activate"
    - python -m ruff check .
    - python -m pytest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - when: never

Build Docker Artifact:
  stage: build
  tags:
    - rc-ai-learning
  variables:
    KUBERNETES_CPU_REQUEST: "250m"
    KUBERNETES_CPU_LIMIT: "1000m"
    KUBERNETES_MEMORY_REQUEST: "256Mi"
    KUBERNETES_MEMORY_LIMIT: "1024Mi"
    KUBERNETES_HELPER_MEMORY_REQUEST: "64Mi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "128Mi"
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs:
    - job: Version Compute
      artifacts: true
    - job: Python Tests
      optional: true
  script:
    - mkdir -p /kaniko/.docker dist
    - echo "{}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --use-new-run \
        --no-push \
        --reproducible \
        --context "." \
        --dockerfile "Containerfile" \
        --destination "$IMAGE_URI" \
        --tar-path "$IMAGE_TAR"
    - gzip -f "$IMAGE_TAR"
    - sha256sum "$IMAGE_TAR_GZ" > "$IMAGE_TAR_GZ.sha256"
    - ls -lh dist
  artifacts:
    name: "tglarn-${NEW_TAG}"
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - when: never
