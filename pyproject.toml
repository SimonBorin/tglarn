[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tglarn"
version = "0.1.0"
description = "Telegram bot wrapper for a classic ReLarn-style text roguelike."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Simon Borin" }
]
dependencies = [
  "aiogram>=3.20,<4",
  "Pillow>=11,<13",
  "pydantic-settings>=2.8,<3",
  "pymongo>=4.11,<5",
  "pyte>=0.8,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
tglarn-bot = "tglarn_bot.main:run"

[tool.setuptools]
packages = ["tglarn_bot", "tglarn_game"]

[tool.setuptools.package-dir]
tglarn_bot = "bot/tglarn_bot"
tglarn_game = "game/tglarn_game"

[tool.setuptools.package-data]
tglarn_bot = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["bot", "game"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
